name: MIRA checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - uses: actions/upload-artifact@v4
        with:
          name: mira-catalog-review
          path: .review/catalog
      - run: flutter build web --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: mira-web
          path: build/web
      - name: Build private phone web client
        run: >-
          flutter build web --release --no-tree-shake-icons
          --dart-define=SUPABASE_URL=https://pwbdfvwqtwnicneqnokh.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_0pcS5N2l0dJ2HG7lMql6Rw_j_M-tO5n
      - uses: actions/upload-artifact@v4
        with:
          name: mira-phone-web
          path: build/web
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: mira-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - run: deno check supabase/functions/mira-ai/index.ts supabase/functions/delete-account/index.ts
      - run: deno test supabase/functions/mira-ai/
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
