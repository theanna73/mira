name: mira
description: A connected planner, wardrobe and nutrition companion.
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.18.0
  http: ^1.5.0
  uuid: ^4.5.1
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/welcome-hero.png
    - assets/data/usda_foods.json
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
